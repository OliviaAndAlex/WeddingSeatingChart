<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liv and Alex's Wedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ballet:opsz@16..72&family=Frank+Ruhl+Libre:wght@300..900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Frank Ruhl Libre', serif;
            background-color: #000;
            color: #fff;
        }

        .homepage {
            height: 100vh;
            width: 100vw;
            background-image: url('Livnalex.JPG');
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .homepage::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(128, 128, 128, 0.5);
        }

        .search-container {
            position: relative;
            z-index: 1;
        }

        #name-input {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px solid #fff;
            color: #fff;
            padding: 15px 20px;
            font-size: 1.5em;
            width: 300px;
            text-align: center;
            font-family: 'Ballet', cursive;
        }

        #name-input::placeholder {
            color: #ddd;
        }

        #autocomplete-list {
            list-style: none;
            padding: 0;
            margin: 0;
            position: absolute;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #fff;
            border-top: none;
            z-index: 2;
        }

        #autocomplete-list li {
            padding: 10px;
            cursor: pointer;
        }

        #autocomplete-list li:hover {
            background-color: #555;
        }

        .hidden {
            display: none;
        }

        .results-page {
            text-align: center;
            padding: 50px 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .results-page.visible {
            opacity: 1;
        }

        .results-page.white-bg {
            background-color: #fff;
            color: #000;
        }

        .results-page.pink-bg {
            background-color: #fdf9f9;
            color: #000;
        }

        #alebrije-image {
            max-width: 80%;
            max-height: 40vh;
            margin-bottom: 20px;
            animation: fadeIn 2s;
        }

        @media (max-width: 768px) {
            #alebrije-image {
                max-height: 50vh;
                margin-bottom: 10px;
            }
        }

        .info {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s, transform 0.5s;
        }

        .info.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #alebrije-description, #guest-name, #table-seat, #meal-selection {
            font-size: 1.2em;
            margin: 10px auto;
            max-width: 800px;
            text-align: center;
        }

        #meal-selection {
            margin-bottom: 40px;
        }

        #guest-name {
            font-family: 'Ballet', cursive;
            font-size: 2.5em;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

            1: "<i>One might wonder at the significance of the Toucan, a creature whose most vibrant signature is its voice. It serves as a guide for a union built on expressive and heartfelt communication, where every word shared is as colorful and intentional as the patterns on its form. Adorned in hues of nature and creativity, this guide suggests that a life shared is a life of joyful expression, a continuous, beautiful dialogue between two spirits.</i>",
            2: "<i>What better guide for a lifelong journey than the a sea turtle, an ancient symbol of endurance, stability, and wisdom. With a shell that represents the home we will build and carry with us, this companion reminds us to move through life with patience and a deep sense of grounding. Its deep aquatic colors speak to a partnership that is both well-rooted and emotionally profound, promising a love that is built to last for all of time and conquer the deepest oceans.</i>",
            3: "<i>And here, a fleeting jewel of the air, the Hummingbird, an animal that when I see, I remember my grandma. In many traditions, it is a sacred messenger of joy and a symbol of tireless devotion. This remarkable guide reminds us to seek out the sweetness in every moment,the nectar, embodying the resilience to travel great distances for the promise of love. Its form, a brilliant prism of color, suggests that a shared love is a multifaceted wonder, where countless individual moments converge to create a single, breathtakingly beautiful whole.</i>",
            4: "<i>What secrets might the Raccoon hold, a guide whose spirit is one of profound curiosity and intelligence. It stands as a companion for life’s intricate journey, celebrating the resourcefulness and adaptability needed to navigate its path together. The mesmerizing patterns that envelop its form symbolize the beautiful and complex life two people weave as one, finding clever and elegant solutions to every puzzle they encounter and never losing the sense of humor.</i>",
            5: "<i>The Winged Mongoose, symbolizes a spirit of both swift courage and boundless aspiration. Its mongoose form speaks of a legendary bravery, a guide for facing life’s challenges with a nimble intelligence and a fearless heart. Yet, it is the wings that elevate its message, suggesting that while a union must be grounded in courage, it is ultimately lifted by chasing shared dreams. This guide represents the beautiful balance of a partnership: brave enough to face any earthly challenge, and inspired enough to soar together toward the horizon.</i>",
            6: "<i>The Hedgehog is a creature of gentle strength, teaching a lesson in emotional safety. It shows us that true protection is not about building walls, but about defining a sacred space where vulnerability is cherished. This guide symbolizes the creation of a home, not of wood and stone, but of trust and mutual respect. It is an emblem for a marriage where both partners can unburden their hearts and reveal their true selves, completely safe in the knowledge that they are profoundly and unconditionally loved.</i>",
            7: "<i>This creature blends the loyal heart of the Dog with the sure-footed ambition of the Goat. It is the perfect symbol of a partnership that climbs. The dog’s spirit represents the unwavering support, loyalty, and companionship that forms the foundation of the journey. The goat’s spirit represents the drive to seek new heights and face challenges head-on. Together, they teach us that in a marriage, you are never climbing alone. You are a team, moving upward with both loyalty and purpose, celebrating every new vista as a shared victory.</i>",

        const nameInput = document.getElementById('name-input');
        const autocompleteList = document.getElementById('autocomplete-list');
        const homepage = document.getElementById('homepage');
        const resultsPage = document.getElementById('results-page');

        nameInput.addEventListener('input', () => {
            const value = nameInput.value.toLowerCase();
            autocompleteList.innerHTML = '';
            if (value.length === 0) {
                return;
            }

            const matches = guestData.filter(guest => guest.name.toLowerCase().includes(value));
            matches.forEach(guest => {
                const li = document.createElement('li');
                li.textContent = guest.name;
                li.addEventListener('click', () => {
                    selectGuest(guest);
                });
                autocompleteList.appendChild(li);
            });
        });

        function selectGuest(guest) {
            homepage.style.transition = 'opacity 1s ease-in-out';
            homepage.style.opacity = 0;
            setTimeout(() => {
                homepage.classList.add('hidden');
                showResults(guest);
            }, 1000);
        }

        function showResults(guest) {
            const seatNumber = parseInt(guest.seat);
            const alebrijeNumber = Math.ceil(seatNumber);
            const alebrijeImageSrc = `Alebrije${alebrijeNumber}.GIF`;
            const alebrijeName = alebrijeNames[alebrijeNumber - 1];

            const alebrijeImage = document.getElementById('alebrije-image');
            alebrijeImage.src = alebrijeImageSrc;

            resultsPage.classList.remove('white-bg', 'pink-bg');

            // This is a simplified check. A more robust solution would analyze the image.
            const whiteBgAlebrijes = [1, 2, 4]; 
            if (whiteBgAlebrijes.includes(alebrijeNumber)) {
                resultsPage.classList.add('white-bg');
            } else if (alebrijeNumber === 5) {
                resultsPage.classList.add('pink-bg');
            }

            const description = `<em>Let this alebrije, a ${alebrijeName}, be your spirit's guide to your table as we welcome you to our reception. In Mexican belief, alebrijes serve as spiritual guides, helping our lost loved ones navigate the transition from the world of the living to world of the dead. They are guardians of the journey. Tonight, however, we have invited these creatures to serve a new purpose. Instead of guiding a journey beyond, they stand as beacons for the new life Olivia and I are about to embark upon, a transition from individuals to life partners. Each alebrije at your table represents a virtue, a hope, or a guiding principle we wish to carry with us into our marriage, our cherished companions for the beautiful transition into husband and wife. </em><br><br>${alebrijeDescriptions[alebrijeNumber]}`;
            document.getElementById('alebrije-description').innerHTML = description;
            document.getElementById('guest-name').textContent = guest.name;
            document.getElementById('table-seat').innerHTML = `<strong>${guest.table}, Seat ${guest.seat}</strong>`;
            document.getElementById('meal-selection').innerHTML = `<strong>Meal: ${guest.meal}</strong>`;

            resultsPage.classList.remove('hidden');
            setTimeout(() => {
                resultsPage.classList.add('visible');
                observeElements();
            }, 100);
        }

        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.info').forEach(el => {
                observer.observe(el);
            });
        }
    </script>
</body>
</html>
